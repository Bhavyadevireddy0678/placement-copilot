services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SQL_READONLY_PASSWORD: ${SQL_READONLY_PASSWORD:?Set SQL_READONLY_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:-raguser}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      RAG_READONLY_DB_URL: postgresql://rag_readonly:${SQL_READONLY_PASSWORD:?Set SQL_READONLY_PASSWORD in .env}@db:5432/${DB_NAME}
      SQL_READONLY_DB_URL: postgresql://rag_readonly:${SQL_READONLY_PASSWORD}@db:5432/${DB_NAME}
      SQL_ALLOW_PII_COLUMNS: ${SQL_ALLOW_PII_COLUMNS:-false}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-5000}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_CACHE_SIZE: ${EMBEDDING_CACHE_SIZE:-512}
      SQL_RESULT_CACHE_SIZE: ${SQL_RESULT_CACHE_SIZE:-128}
      SQL_RESULT_CACHE_TTL_SECONDS: ${SQL_RESULT_CACHE_TTL_SECONDS:-30}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_DISTANCE_THRESHOLD: ${RAG_DISTANCE_THRESHOLD:-0.7}
      HYBRID_RETRIEVAL_ENABLED: ${HYBRID_RETRIEVAL_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  pgdata: